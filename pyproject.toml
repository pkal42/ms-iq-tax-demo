[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "meridian-iq-demo"
version = "0.1.0"
description = "Four-IQ Microsoft Foundry demo for Meridian Tax Advisors"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "azure-ai-agents>=1.1.0,<2",
  "azure-ai-projects>=1.0.0,<3",
  "azure-identity>=1.19.0,<2",
  "python-dotenv>=1.0.1,<2",
  "fastapi>=0.115.0,<1",
  "rich>=13.9.0,<15",
  "typer>=0.15.0,<1",
  "uvicorn[standard]>=0.34.0,<1",
]

[project.optional-dependencies]
agents = [
  "agent-framework>=1.0.0b251001",
  "agent-framework-foundry>=1.0.0b251001",
]
dev = [
  "pytest>=8.3.0,<9",
  "pytest-cov>=6.0.0,<8",
]

[project.scripts]
meridian-iq = "meridian_iq.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/meridian_iq"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
